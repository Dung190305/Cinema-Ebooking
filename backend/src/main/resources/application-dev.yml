spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/cinema_ebooking_db?sslMode=REQUIRED&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&sessionVariables=sql_require_primary_key=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  # ================== MAIL CONFIG ==================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ================== AI SERVICE CONFIG ==================
ai:
  service:
    url: http://localhost:8081/api/v1/ai/analyze
    enabled: true
    timeout-connect: 5000
    timeout-read: 10000