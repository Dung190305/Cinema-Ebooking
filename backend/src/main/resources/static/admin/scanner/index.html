<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Scanner Check-in - Cinema Admin</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
      background: #0f0f1a;
      min-height: 100vh;
      color: #e0e0e0;
    }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title { color: #fff; font-size: 20px; font-weight: 800; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-user { color: rgba(255,255,255,0.8); font-size: 13px; }
    .btn-logout {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.25); }

    /* ── MAIN ── */
    .main {
      display: grid;
      grid-template-columns: 400px 1fr;
      min-height: calc(100vh - 62px);
    }

    /* ── LOGIN PANEL ── */
    .login-panel {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
    }
    .login-box {
      width: 100%;
      max-width: 340px;
    }
    .login-logo {
      font-size: 48px;
      text-align: center;
      margin-bottom: 24px;
    }
    .login-title {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }
    .login-sub {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      color: #888;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%;
      background: #0f0f1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e0e0e0;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: #e53935; }
    .form-group input::placeholder { color: #555; }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-login:hover { opacity: 0.9; }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-error {
      background: #2d0a0a;
      border: 1px solid #c62828;
      color: #ff8a80;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    /* ── SCANNER PANEL ── */
    .scanner-panel {
      background: #1a1a2e;
      padding: 24px;
      border-right: 1px solid #2a2a3e;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .scanner-title { color: #fff; font-size: 15px; font-weight: 700; margin-bottom: 14px; }
    #reader {
      width: 300px;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #333;
    }
    .scanner-hint { color: #666; font-size: 12px; margin-top: 12px; text-align: center; }
    .scanner-status {
      margin-top: 12px;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: none;
    }
    .scanner-status.active { background: #1b3a1b; color: #a5d6a7; display: block; }
    .scanner-status.error { background: #3a1010; color: #ff8a80; display: block; }

    .divider {
      width: 100%;
      text-align: center;
      color: #444;
      font-size: 12px;
      margin: 16px 0;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #333;
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .btn-manual {
      width: 100%;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background: transparent;
      color: #888;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-manual:hover { border-color: #e53935; color: #e53935; }

    /* ── INFO PANEL ── */
    .info-panel { padding: 24px 32px; overflow-y: auto; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 400px;
      text-align: center;
    }
    .empty-icon { font-size: 56px; opacity: 0.12; margin-bottom: 12px; }
    .empty-title { color: #444; font-size: 18px; font-weight: 600; margin-bottom: 6px; }
    .empty-sub { color: #333; font-size: 13px; }

    /* ── BOOKING CARD ── */
    .booking-card { display: none; }
    .booking-card.show { display: block; }

    .booking-header {
      background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 14px 14px 0 0;
    }
    .booking-movie { color: #fff; font-size: 17px; font-weight: 800; }
    .booking-time { color: rgba(255,255,255,0.75); font-size: 12px; margin-top: 3px; }
    .booking-status-badge {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .booking-status-badge.confirmed { background: #1b5e20; color: #a5d6a7; }
    .booking-status-badge.pending { background: #7a3b00; color: #ffcc80; }
    .booking-status-badge.cancelled { background: #4a1010; color: #ff8a80; }

    .booking-body { background: #16213e; padding: 18px 22px; border-radius: 0 0 14px 14px; }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .info-item { background: #0f3460; border-radius: 8px; padding: 10px 12px; }
    .info-label { color: #666; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
    .info-value { color: #fff; font-size: 13px; font-weight: 600; }

    .section-title { color: #666; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }

    .seat-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .seat-tag {
      background: #0f3460;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .seat-tag.vip { border: 1px solid #ff9800; color: #ff9800; }
    .seat-tag.standard { border: 1px solid #42a5f5; color: #42a5f5; }
    .seat-tag.couple { border: 1px solid #ce93d8; color: #ce93d8; }

    .combo-list { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
    .combo-item { background: #0f3460; border-radius: 8px; padding: 9px 12px; display: flex; justify-content: space-between; }
    .combo-name { color: #e0e0e0; font-size: 13px; font-weight: 600; }
    .combo-qty { color: #888; font-size: 12px; }

    .coupon-item {
      background: #f0fff4;
      border: 1px solid #2e7d32;
      border-radius: 8px;
      padding: 9px 12px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .coupon-code { color: #2e7d32; font-size: 13px; font-weight: 700; }
    .coupon-discount { color: #c62828; font-size: 13px; font-weight: 800; }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-top: 1px solid #2a2a3e;
      margin-top: 4px;
    }
    .total-label { color: #888; font-size: 13px; }
    .total-amount { color: #e53935; font-size: 20px; font-weight: 800; }

    .btn-checkin {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 14px;
      letter-spacing: 0.5px;
    }
    .btn-checkin.primary {
      background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
      color: #fff;
      box-shadow: 0 4px 16px rgba(229,57,53,0.35);
    }
    .btn-checkin:disabled { background: #333 !important; color: #666 !important; box-shadow: none; cursor: not-allowed; }
    .btn-rescan {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 8px;
      background: transparent;
      color: #666;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-rescan:hover { border-color: #e53935; color: #e53935; }

    /* ── RESULT MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: #1a1a2e;
      border-radius: 18px;
      padding: 28px;
      width: 440px;
      max-width: 92vw;
      text-align: center;
      border: 1px solid #2a2a3e;
    }
    .modal-icon { font-size: 56px; margin-bottom: 12px; }
    .modal-title { color: #fff; font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .modal-sub { color: #888; font-size: 13px; margin-bottom: 20px; }

    .ticket-results { text-align: left; margin-bottom: 18px; max-height: 280px; overflow-y: auto; }
    .ticket-result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 12px;
      background: #16213e;
      border-radius: 7px;
      margin-bottom: 5px;
    }
    .ticket-result-item.ok { border-left: 3px solid #4caf50; }
    .ticket-result-item.skip { border-left: 3px solid #ff9800; }
    .ticket-result-item.fail { border-left: 3px solid #f44336; }
    .ticket-seat { color: #e0e0e0; font-size: 13px; font-weight: 600; }
    .ticket-msg { font-size: 11px; color: #888; }
    .ticket-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; }
    .ticket-badge.ok { background: #1b5e20; color: #a5d6a7; }
    .ticket-badge.skip { background: #7a3b00; color: #ffcc80; }
    .ticket-badge.fail { background: #4a1010; color: #ff8a80; }

    .modal-summary {
      background: #16213e;
      border-radius: 9px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 5px; color: #999; font-size: 13px; }
    .summary-row:last-child { margin-bottom: 0; }
    .summary-row .val { font-weight: 700; color: #fff; }

    .btn-close {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-close:hover { background: #444; }

    /* ── LOADER ── */
    .loader {
      display: none;
      width: 36px;
      height: 36px;
      border: 3px solid #333;
      border-top-color: #e53935;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    .loader.show { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── DEBUG LOG ── */
    .debug-log {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0a0a14;
      border-top: 1px solid #333;
      padding: 8px 16px;
      font-family: monospace;
      font-size: 12px;
      max-height: 120px;
      overflow-y: auto;
      display: none;
      z-index: 1000;
    }
    .debug-log.show { display: block; }
    .debug-log .log-line { color: #aaa; margin-bottom: 3px; }
    .debug-log .log-line.error { color: #ff6b6b; }
    .debug-log .log-line.success { color: #69db7c; }
    .debug-toggle {
      position: fixed;
      bottom: 8px;
      right: 8px;
      background: #222;
      color: #888;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11px;
      cursor: pointer;
      z-index: 1001;
    }
    .debug-toggle:hover { color: #fff; }

    @media (max-width: 768px) {
      .main { grid-template-columns: 1fr; }
      .info-panel { padding: 16px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-title">Cinema Check-in Scanner</div>
  <div class="header-right" id="headerRight">
    <!-- filled by JS -->
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="main">

  <!-- LEFT COLUMN -->
  <div class="scanner-panel" id="leftColumn">
    <!-- LOGIN FORM (shown when not logged in) -->
    <div class="login-panel" id="loginPanel">
      <div class="login-box">
        <div class="login-logo">&#127916;</div>
        <div class="login-title">Admin Login</div>
        <div class="login-sub">Đăng nhập để sử dụng Scanner</div>

        <div class="login-error" id="loginError"></div>

        <div class="form-group">
          <label>Username hoặc Email</label>
          <input type="text" id="loginUsername" placeholder="admin@cinema.com" autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" autocomplete="current-password">
        </div>
        <button class="btn-login" id="btnLogin">Đăng nhập</button>
      </div>
    </div>

    <!-- SCANNER (shown when logged in) -->
    <div id="scannerPanel" style="display:none; width:100%; display:flex; flex-direction:column; align-items:center;">
      <div class="scanner-title">Quét mã QR</div>
      <div id="reader"></div>
      <div class="scanner-status" id="scannerStatus"></div>
      <div class="scanner-hint">Đưa mã QR vào khung camera</div>

      <div class="divider">— hoặc —</div>

      <button class="btn-manual" id="btnManualInput">Nhập mã đặt vé</button>
    </div>
  </div>

  <!-- RIGHT: INFO -->
  <div class="info-panel" id="infoPanel">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">&#128269;</div>
      <div class="empty-title">Sẵn sàng quét QR</div>
      <div class="empty-sub">Quét mã hoặc nhập mã để bắt đầu</div>
    </div>

    <div class="booking-card" id="bookingCard">
      <div class="booking-header">
        <div>
          <div class="booking-movie" id="movieTitle">—</div>
          <div class="booking-time" id="showtimeTime">—</div>
        </div>
        <div class="booking-status-badge" id="statusBadge">—</div>
      </div>
      <div class="booking-body">
        <div class="info-grid">
          <div class="info-item">
            <div class="info-label">Mã đặt vé</div>
            <div class="info-value" id="bookingCode">—</div>
          </div>
          <div class="info-item">
            <div class="info-label">Rạp chiếu</div>
            <div class="info-value" id="cinemaName">—</div>
          </div>
          <div class="info-item">
            <div class="info-label">Phòng chiếu</div>
            <div class="info-value" id="roomName">—</div>
          </div>
          <div class="info-item">
            <div class="info-label">Thành viên</div>
            <div class="info-value" id="tierName">—</div>
          </div>
        </div>

        <div class="section-title">Ghế</div>
        <div class="seat-tags" id="seatsList"></div>

        <div class="section-title" id="combosSectionTitle" style="display:none">Combo</div>
        <div class="combo-list" id="combosList"></div>

        <div id="couponSection" style="display:none">
          <div class="section-title">Mã giảm giá</div>
          <div class="coupon-item">
            <span class="coupon-code" id="couponCode">—</span>
            <span class="coupon-discount" id="couponDiscount">—</span>
          </div>
        </div>

        <div class="total-row">
          <span class="total-label">Tổng cộng</span>
          <span class="total-amount" id="finalAmount">—</span>
        </div>
      </div>

      <div style="padding: 0 22px 20px;">
        <div class="loader" id="checkinLoader"></div>
        <button class="btn-checkin primary" id="btnCheckin">Xác nhận Check-in</button>
        <button class="btn-rescan" id="btnRescan">Quét mã khác</button>
      </div>
    </div>
  </div>
</div>

<!-- RESULT MODAL -->
<div class="modal-overlay" id="resultModal">
  <div class="modal">
    <div class="modal-icon" id="modalIcon">&#10004;</div>
    <div class="modal-title" id="modalTitle">—</div>
    <div class="modal-sub" id="modalSub">—</div>

    <div class="modal-summary" id="modalSummary">
      <div class="summary-row"><span>Tổng vé</span><span class="val" id="resTotal">0</span></div>
      <div class="summary-row"><span>Thành công</span><span class="val" id="resSuccess" style="color:#4caf50">0</span></div>
      <div class="summary-row"><span>Thất bại</span><span class="val" id="resFail" style="color:#f44336">0</span></div>
    </div>

    <div class="ticket-results" id="ticketResults"></div>
    <button class="btn-close" id="btnCloseModal">Đóng</button>
  </div>
</div>

<!-- DEBUG LOG -->
<button class="debug-toggle" id="debugToggle">Debug Log</button>
<div class="debug-log" id="debugLog"></div>

<script>
// ── STATE ──
const API_BASE = '/api/v1';
let currentToken = localStorage.getItem('admin_jwt') || '';
let currentUser = localStorage.getItem('admin_user') || '';
let currentBookingCode = '';
let html5QrCode = null;
let scanningActive = false;

// ── INIT ──
window.addEventListener('DOMContentLoaded', () => {
  setupEventListeners();
  if (currentToken) {
    showScannerUI();
  } else {
    showLoginUI();
  }
});

function setupEventListeners() {
  document.getElementById('btnLogin').addEventListener('click', handleLogin);
  document.getElementById('loginPassword').addEventListener('keypress', e => {
    if (e.key === 'Enter') handleLogin();
  });
  document.getElementById('btnCheckin').addEventListener('click', () => {
    if (currentBookingCode) performCheckin(currentBookingCode);
  });
  document.getElementById('btnRescan').addEventListener('click', resetToScan);
  document.getElementById('btnManualInput').addEventListener('click', handleManualInput);
  document.getElementById('btnCloseModal').addEventListener('click', () => {
    document.getElementById('resultModal').classList.remove('show');
    resetToScan();
  });
  document.getElementById('debugToggle').addEventListener('click', () => {
    document.getElementById('debugLog').classList.toggle('show');
  });
}

// ── DEBUG LOG ──
function log(msg, type = 'info') {
  const el = document.getElementById('debugLog');
  const line = document.createElement('div');
  line.className = 'log-line ' + type;
  const ts = new Date().toLocaleTimeString();
  line.textContent = `[${ts}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
  console.log('[SCANNER]', msg);
}

// ── LOGIN ──
async function handleLogin() {
  const email = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('btnLogin');
  const errEl = document.getElementById('loginError');

  if (!email || !password) {
    errEl.textContent = 'Vui lòng nhập email và password';
    errEl.style.display = 'block';
    return;
  }

  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Đang đăng nhập...';

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();
    log(`Login response: ${res.status}`, res.ok ? 'success' : 'error');
    log(`Response: ${JSON.stringify(data)}`, res.ok ? 'success' : 'error');

    if (!res.ok) {
      errEl.textContent = data.error?.message || 'Đăng nhập thất bại';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Đăng nhập';
      return;
    }

    currentToken = data.data.accessToken;
    currentUser = data.data.role || email;
    localStorage.setItem('admin_jwt', currentToken);
    localStorage.setItem('admin_user', currentUser);

    log(`Login OK, token: ${currentToken.substring(0, 20)}...`, 'success');
    showScannerUI();
  } catch (err) {
    errEl.textContent = 'Lỗi kết nối: ' + err.message;
    errEl.style.display = 'block';
    log('Login error: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Đăng nhập';
  }
}

function logout() {
  currentToken = '';
  currentUser = '';
  localStorage.removeItem('admin_jwt');
  localStorage.removeItem('admin_user');
  stopScanner();
  showLoginUI();
  log('Logged out', 'info');
}

// ── UI STATE ──
function showLoginUI() {
  document.getElementById('loginPanel').style.display = 'flex';
  document.getElementById('scannerPanel').style.display = 'none';
  document.getElementById('headerRight').innerHTML = '';
  document.getElementById('bookingCard').classList.remove('show');
  document.getElementById('emptyState').style.display = 'flex';
}

function showScannerUI() {
  document.getElementById('loginPanel').style.display = 'none';
  document.getElementById('scannerPanel').style.display = 'flex';
  document.getElementById('headerRight').innerHTML = `
    <span class="header-user">&#128100; ${currentUser}</span>
    <button class="btn-logout" onclick="logout()">Đăng xuất</button>
  `;
  startScanner();
}

// ── SCANNER ──
async function startScanner() {
  html5QrCode = new Html5Qrcode('reader');

  // Try camera sau (environment) trước → fallback camera trước (user)
  const configs = [
    { facingMode: 'environment' },   // camera sau điện thoại
    { facingMode: 'user' },          // camera trước
    {},                              // fallback: bất kỳ camera nào
  ];

  for (const config of configs) {
    try {
      await html5QrCode.start(
        config,
        { fps: 10, qrbox: { width: 240, height: 240 } },
        onQrSuccess,
        () => {}
      );
      scanningActive = true;
      showScannerStatus('active', 'Camera đang hoạt động');
      log('Scanner started: ' + JSON.stringify(config), 'success');
      return;
    } catch (err) {
      log('Camera config failed: ' + JSON.stringify(config) + ' — ' + err.message, 'error');
    }
  }

  showScannerStatus('error', 'Không truy cập được camera. Hãy cấp quyền camera cho trình duyệt.');
  log('All camera configs failed', 'error');
}

function onQrSuccess(decodedText) {
  if (!scanningActive) return;
  scanningActive = false;
  log('QR scanned: ' + decodedText);
  const code = extractBookingCode(decodedText);
  if (!code) {
    log('Invalid QR format: ' + decodedText, 'error');
    showScannerStatus('error', 'Mã QR không hợp lệ');
    setTimeout(() => { scanningActive = true; }, 2000);
    return;
  }
  currentBookingCode = code;
  log('Booking code extracted: ' + code, 'success');
  showScannerStatus('active', 'Tra cứu: ' + code);
  stopScanner();
  lookupBooking(code);
}

function extractBookingCode(raw) {
  if (!raw) return null;
  if (raw.startsWith('CINEMA:BOOKING:')) return raw.substring('CINEMA:BOOKING:'.length);
  if (raw.startsWith('BOOK-')) return raw.substring(5);
  if (raw.startsWith('BOK-')) return raw;
  // fallback: assume raw is the code
  return raw.trim();
}

function stopScanner() {
  if (html5QrCode && scanningActive) {
    html5QrCode.stop().then(() => { scanningActive = false; }).catch(() => {});
  }
}

function showScannerStatus(cls, msg) {
  const el = document.getElementById('scannerStatus');
  el.className = 'scanner-status ' + (cls || '');
  el.textContent = msg;
  el.style.display = cls ? 'block' : 'none';
}

// ── MANUAL INPUT ──
function handleManualInput() {
  const code = prompt('Nhập mã đặt vé (VD: BOK-E324605E):');
  if (code && code.trim()) {
    const extracted = extractBookingCode(code.trim());
    currentBookingCode = extracted;
    log('Manual input, extracted: ' + extracted);
    lookupBooking(extracted);
  }
}

// ── API ──
function buildHeaders() {
  return {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + currentToken
  };
}

async function lookupBooking(code) {
  log(`Looking up: ${code}`);
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('bookingCard').classList.add('show');

  try {
    const res = await fetch(`${API_BASE}/checkin/lookup?code=${encodeURIComponent(code)}`, {
      headers: buildHeaders()
    });

    log(`Lookup HTTP: ${res.status}`);

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      log(`Lookup error: ${err.error?.message || res.statusText}`, 'error');
      showError(err.error?.message || 'Không tìm thấy mã vé này');
      return;
    }

    const data = await res.json();
    log(`Booking found: ${data.data.movieTitle}, status=${data.data.status}`, 'success');
    displayBooking(data.data);

  } catch (err) {
    log('Lookup exception: ' + err.message, 'error');
    showError('Lỗi kết nối: ' + err.message);
  }
}

async function performCheckin(code) {
  log(`Check-in request for: ${code}`);
  const btn = document.getElementById('btnCheckin');
  const loader = document.getElementById('checkinLoader');
  btn.disabled = true;
  btn.textContent = 'Đang xử lý...';
  loader.classList.add('show');

  try {
    const res = await fetch(`${API_BASE}/checkin/${encodeURIComponent(code)}`, {
      method: 'POST',
      headers: buildHeaders()
    });

    log(`Check-in HTTP: ${res.status}`);

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      log(`Check-in error: ${err.error?.message || res.statusText}`, 'error');
      alert('Check-in thất bại: ' + (err.error?.message || res.statusText));
      btn.disabled = false;
      btn.textContent = 'Xác nhận Check-in';
      loader.classList.remove('show');
      return;
    }

    const data = await res.json();
    log(`Check-in result: ${data.data.successCount}/${data.data.totalTickets} OK, ${data.data.failCount} fail`, data.data.failCount === 0 ? 'success' : 'info');
    showResultModal(data.data);

  } catch (err) {
    log('Check-in exception: ' + err.message, 'error');
    alert('Lỗi kết nối: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Xác nhận Check-in';
    loader.classList.remove('show');
  }
}

// ── DISPLAY ──
function displayBooking(b) {
  document.getElementById('movieTitle').textContent = b.movieTitle || '—';
  document.getElementById('showtimeTime').textContent = formatDateTime(b.showtimeStartTime);
  document.getElementById('bookingCode').textContent = b.bookingCode || '—';
  document.getElementById('cinemaName').textContent = b.cinemaName || '—';
  document.getElementById('roomName').textContent = b.roomName || '—';
  document.getElementById('tierName').textContent = b.membershipTierName || '—';
  document.getElementById('finalAmount').textContent = formatCurrency(b.finalAmount);

  const badge = document.getElementById('statusBadge');
  const statusMap = {
    CONFIRMED: ['confirmed', 'Đã thanh toán'],
    PENDING: ['pending', 'Chờ thanh toán'],
    CANCELLED: ['cancelled', 'Đã hủy'],
    EXPIRED: ['cancelled', 'Đã hết hạn'],
  };
  const [cls, label] = statusMap[b.status] || ['cancelled', b.status];
  badge.className = 'booking-status-badge ' + cls;
  badge.textContent = label;

  // Seats
  const seatsEl = document.getElementById('seatsList');
  seatsEl.innerHTML = '';
  if (b.seats && b.seats.length) {
    b.seats.forEach(seat => {
      const t = document.createElement('span');
      const type = (seat.seatType || '').toLowerCase();
      t.className = 'seat-tag ' + (type.includes('vip') ? 'vip' : type.includes('couple') ? 'couple' : 'standard');
      t.textContent = seat.seatName;
      seatsEl.appendChild(t);
    });
  }

  // Combos
  const comboTitle = document.getElementById('combosSectionTitle');
  const combosList = document.getElementById('combosList');
  if (b.combos && b.combos.length) {
    comboTitle.style.display = 'block';
    combosList.innerHTML = '';
    b.combos.forEach(c => {
      const item = document.createElement('div');
      item.className = 'combo-item';
      item.innerHTML = `<span class="combo-name">${c.comboName}</span><span class="combo-qty">x${c.quantity}</span>`;
      combosList.appendChild(item);
    });
  } else {
    comboTitle.style.display = 'none';
    combosList.innerHTML = '';
  }

  // Coupon
  const couponSec = document.getElementById('couponSection');
  if (b.coupon) {
    couponSec.style.display = 'block';
    document.getElementById('couponCode').textContent = b.coupon.code || '—';
    document.getElementById('couponDiscount').textContent = '-' + formatCurrency(b.coupon.discountValue);
  } else {
    couponSec.style.display = 'none';
  }

  // Button
  const btn = document.getElementById('btnCheckin');
  if (b.status !== 'CONFIRMED') {
    btn.disabled = true;
    btn.textContent = 'Vé chưa thanh toán';
    btn.className = 'btn-checkin';
  } else {
    btn.disabled = false;
    btn.textContent = 'Xác nhận Check-in';
    btn.className = 'btn-checkin primary';
  }
}

function showError(msg) {
  document.getElementById('emptyState').querySelector('.empty-sub').textContent = msg;
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('bookingCard').classList.remove('show');
  showScannerStatus('error', msg);
  setTimeout(() => {
    showScannerStatus('', '');
    scanningActive = true;
    startScanner();
  }, 3000);
}

function resetToScan() {
  currentBookingCode = '';
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('bookingCard').classList.remove('show');
  showScannerStatus('', '');
  startScanner();
}

// ── RESULT MODAL ──
function showResultModal(data) {
  const modal = document.getElementById('resultModal');
  modal.classList.add('show');

  const allOk = data.failCount === 0;
  document.getElementById('modalIcon').innerHTML = allOk ? '&#10004;' : '&#9888;';
  document.getElementById('modalTitle').textContent = allOk ? 'Check-in thành công!' : 'Hoàn thành (có lỗi)';
  document.getElementById('modalSub').textContent = allOk
    ? `Tất cả ${data.totalTickets} vé đã được soát`
    : `${data.successCount}/${data.totalTickets} vé thành công`;

  document.getElementById('resTotal').textContent = data.totalTickets;
  document.getElementById('resSuccess').textContent = data.successCount;
  document.getElementById('resFail').textContent = data.failCount;

  const resultsEl = document.getElementById('ticketResults');
  resultsEl.innerHTML = '';
  data.tickets.forEach(t => {
    const item = document.createElement('div');
    let cls, badge;
    if (t.success) {
      cls = 'ok'; badge = 'OK';
    } else if (t.message && t.message.includes('trước')) {
      cls = 'skip'; badge = 'SKIP';
    } else {
      cls = 'fail'; badge = 'FAIL';
    }
    item.className = 'ticket-result-item ' + cls;
    item.innerHTML = `
      <div>
        <div class="ticket-seat">${t.seatName || t.ticketCode}</div>
        ${t.message ? `<div class="ticket-msg">${t.message}</div>` : ''}
      </div>
      <span class="ticket-badge ${cls}">${badge}</span>
    `;
    resultsEl.appendChild(item);
  });
}

// ── HELPERS ──
function formatCurrency(amount) {
  if (!amount && amount !== 0) return '—';
  return Number(amount).toLocaleString('vi-VN', { style: 'currency', currency: 'VND' });
}

function formatDateTime(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    return d.toLocaleString('vi-VN', {
      weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  } catch { return iso; }
}
