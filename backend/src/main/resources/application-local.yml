spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cinema_ebooking_db?serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_LOCAL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  # ================== MAIL CONFIG ==================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ================== AI SERVICE CONFIG ==================
ai:
  service:
    url: http://localhost:8081/api/v1/ai/analyze
    enabled: true
    timeout-connect: 5000
    timeout-read: 10000